<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- cascade layer order, lowest first: the app reset, Astryx, then its Almanac theme. Must come
         before any stylesheet so it is the first layer statement the browser sees. -->
    <style>@layer xr-reset, astryx-base, astryx-theme, xr-theme;</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4ECD8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <title>Xenos Rampant Army Builder and Detachment Builder</title>
    <!-- One sentence, the same shape across all five WarLore builders: what you
         do with it, whose game it is, who published the game, who made the
         tool. "Unofficial" is the load-bearing word and leads for that
         reason: it is what a publisher and a stranger both need to read
         first. The feature list that used to live here is gone: a
         description is not a changelog. -->
    <meta name="description" content="Assemble and print your detachment in this unofficial detachment builder for Xenos Rampant, published by Osprey Games. This web app was designed by WarLore" />
    <link rel="canonical" href="https://type37.github.io/xenos-rampant-force-builder/" />
    <meta name="keywords" content="Xenos Rampant, army builder, detachment builder, army list builder, roster, points calculator, detachment, Osprey Games, sci-fi wargame" />
    <meta name="author" content="WarLore" />

    <!-- Open Graph -->
    <!-- og-image cache version: bump this number (og-image.png?v=N) any time og-image.png
         is replaced. Discord, Slack, etc. cache link previews per exact URL, so changing
         the picture alone won't refresh what's already been shared; a new URL forces it. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Xenos Rampant Army Builder and Detachment Builder" />
    <meta property="og:description" content="Assemble and print your detachment in this unofficial detachment builder for Xenos Rampant, published by Osprey Games. This web app was designed by WarLore" />
    <meta property="og:url" content="https://type37.github.io/xenos-rampant-force-builder/" />
    <meta property="og:site_name" content="WarLore" />
    <meta property="og:image" content="https://type37.github.io/xenos-rampant-force-builder/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="A Space Pirates detachment open in the Builder: unit rows on the left, the Looters stat table on the right with its activation and profile values" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Xenos Rampant Army Builder and Detachment Builder" />
    <meta name="twitter:description" content="Assemble and print your detachment in this unofficial detachment builder for Xenos Rampant, published by Osprey Games. This web app was designed by WarLore" />
    <meta name="twitter:image" content="https://type37.github.io/xenos-rampant-force-builder/og-image.png?v=2" />

    <!-- Structured data: this page is the web app itself -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Xenos Rampant Army Builder",
      "alternateName": "Xenos Rampant Detachment Builder",
      "url": "https://type37.github.io/xenos-rampant-force-builder/",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Any (web browser)",
      "browserRequirements": "Requires JavaScript",
      "description": "Assemble and print your detachment in this unofficial detachment builder for Xenos Rampant, published by Osprey Games. This web app was designed by WarLore",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": { "@type": "Organization", "name": "WarLore", "url": "https://jetwong.neocities.org/wargaming" },
      "about": { "@type": "Game", "name": "Xenos Rampant", "publisher": "Osprey Games" }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Xenos Rampant Army Builder</h1>
      <p>A free online army and detachment builder for Xenos Rampant, the sci-fi skirmish wargame by Daniel Mersey and Richard Cowen (Osprey Games, 2022). Build a legal detachment, track points, configure xeno rules and loadouts, roll Commander traits, and print a roster. This tool needs JavaScript enabled to run.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Shared WarLore footer. Hidden on work views (see src/index.css). -->
    <script src="https://type37.github.io/warlore-footer/footer.js" data-current="xenos" defer></script>
  </body>
</html>
